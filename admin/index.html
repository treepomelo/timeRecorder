<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>礼物书管理端</title><link rel="stylesheet" href="style.css"></head><body><header><b>📖 礼物书管理端</b><span id="saveState">未保存</span><button id="newBook">新建</button><button id="importBtn">导入 JSON</button><button id="exportBtn">导出 JSON</button><button id="previewBtn">阅读预览</button><input id="fileInput" type="file" accept="application/json" hidden></header><main><aside><h3>章节与页面 <button id="addChapter">＋</button></h3><div id="tree"></div><button id="addPage">＋添加页面</button></aside><section class="editor"><div class="bookhead"><input id="bookTitle" placeholder="书名"><input id="bookSubtitle" placeholder="副标题"></div><div id="pageEditor"></div></section><aside><h3>页面设置</h3><label>页面类型<select id="pageType"><option value="cover">封面</option><option value="text">正文</option><option value="image">图片</option><option value="letter">信件</option><option value="ending">结尾</option></select></label><label>主题<select id="theme"><option value="cream">奶油纸张</option><option value="sakura">樱花</option><option value="night">夜空</option><option value="forest">森系</option></select></label><label>每页文字行数<input id="lineCount" type="number" min="3" max="30"></label><label>字号<input id="fontSize" type="number" min="12" max="40"></label><label>行距<input id="lineHeight" type="number" step=".1" min="1" max="3"></label><label>背景音乐<select id="track"></select></label><button id="addTrack">＋添加 BGM</button><div id="tracks"></div></aside></main><script src="app.js"></script></body></html>
